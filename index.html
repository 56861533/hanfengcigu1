<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寒风刺骨 — 答题器</title>
    <style>
        /* ===== 全局重置 ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:       #0b1219;
            --surface:  #141e28;
            --border:   #1e2d3d;
            --ice:      #7ec8e0;
            --ice-dim:  #3a6b80;
            --frost:    #b8dff0;
            --text:     #c8d6e0;
            --text-dim: #6b7d8e;
            --red:      #e0556a;
            --green:    #4caf8e;
            --amber:    #d4a843;
            --radius:   8px;
            --radius-sm: 4px;
            --shadow:   0 4px 24px rgba(0,0,0,0.45);
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
        }

        /* ===== 顶部标题栏 ===== */
        .app-header {
            background: linear-gradient(180deg, #101e2c 0%, #0b1722 100%);
            border-bottom: 1px solid var(--border);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .app-header .inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #a8d8ea, #5ba4bf, #7ec8e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-title .frost {
            font-size: 11px;
            display: block;
            letter-spacing: 2px;
            opacity: 0.6;
            -webkit-text-fill-color: #5b8fa0;
        }

        /* ===== 主布局 ===== */
        .main-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .toolbar .label {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        .toolbar select, .toolbar button {
            background: var(--bg);
            color: var(--frost);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all .2s;
            font-family: inherit;
        }
        .toolbar select:hover, .toolbar button:hover {
            border-color: var(--ice-dim);
            color: #fff;
        }
        .toolbar button.primary {
            background: #1a3a48;
            border-color: var(--ice-dim);
            color: var(--frost);
            font-weight: 600;
        }
        .toolbar button.primary:hover {
            background: #224758;
            border-color: var(--ice);
        }
        .toolbar button.danger {
            background: #3a1a22;
            border-color: #5a2a32;
            color: #e8a0aa;
        }
        .toolbar button.danger:hover {
            background: #4a2230;
            border-color: #8a3a44;
        }
        .score-badge {
            margin-left: auto;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--ice);
            white-space: nowrap;
        }
        .score-badge span { font-size: 24px; }

        /* ===== 进度条 ===== */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ice-dim), var(--ice));
            border-radius: 2px;
            transition: width .3s;
        }

        /* ===== 题目卡片 ===== */
        .question-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: border-color .2s;
        }
        .question-card.answered          { border-color: var(--ice-dim); }
        .question-card.correct           { border-color: var(--green); border-left: 3px solid var(--green); }
        .question-card.incorrect         { border-color: var(--red);   border-left: 3px solid var(--red); }
        .question-card.correct::after,
        .question-card.incorrect::after {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 18px;
            font-weight: 700;
            pointer-events: none;
        }
        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 18px;
        }
        .q-num {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: var(--border);
            color: var(--text-dim);
            letter-spacing: 0;
        }
        .q-num.single  { background: #1a3040; color: #7ec8e0; }
        .q-num.multi   { background: #2a2818; color: #d4a843; }
        .q-num.judge   { background: #1a2820; color: #4caf8e; }
        .q-type-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .q-type-tag.single  { background: #1a3040; color: #7ec8e0; }
        .q-type-tag.multi   { background: #2a2818; color: #d4a843; }
        .q-type-tag.judge   { background: #1a2820; color: #4caf8e; }
        .q-text {
            font-size: 15px;
            line-height: 1.75;
            color: #e8f0f5;
            letter-spacing: 0.5px;
        }

        /* ===== 选项 ===== */
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all .18s;
            font-size: 14px;
            line-height: 1.6;
        }
        .option:hover { border-color: var(--ice-dim); background: #111e28; }
        .option input { display: none; }
        .option .dot {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            margin-top: 2px;
        }
        .option.multi-opt .dot { border-radius: 3px; }
        .option.selected { border-color: var(--ice); background: #101e2a; }
        .option.selected .dot { border-color: var(--ice); background: var(--ice); }
        .option.selected .dot::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bg);
        }
        .option.multi-opt.selected .dot::after {
            content: '✓';
            width: auto; height: auto;
            border-radius: 0;
            background: none;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
        }
        .option.correct-answer { border-color: var(--green) !important; background: #0f2018 !important; }
        .option.correct-answer .dot { border-color: var(--green); background: var(--green); }
        .option.wrong-answer     { border-color: var(--red)   !important; background: #200f14 !important; }
        .option.wrong-answer .dot { border-color: var(--red); background: var(--red); }
        .option.missed-correct   { border-color: var(--amber) !important; background: #1f1a0d !important; }
        .option.missed-correct .dot { border-color: var(--amber); background: var(--amber); }

        /* ===== 解释提示 ===== */
        .explain {
            margin-top: 14px;
            padding: 12px 16px;
            background: #0f1a1f;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--ice);
            border-left: 3px solid var(--ice-dim);
            letter-spacing: 0.5px;
            display: none;
        }
        .question-card.show-explain .explain { display: block; }

        /* 多选确认按钮 */
        .confirm-multi-wrap {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .confirm-multi-btn {
            padding: 8px 22px;
            background: var(--ice-dim);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .confirm-multi-btn:hover {
            background: var(--ice);
        }
        .confirm-multi-btn:disabled {
            background: #1e2d38;
            color: #4a5a68;
            cursor: not-allowed;
        }
        .confirm-multi-btn:disabled:hover {
            background: #1e2d38;
        }
        .confirm-multi-hint {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        /* ===== 底部提交区 ===== */
        .submit-bar {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 28px;
            padding: 18px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            align-items: center;
        }
        .submit-bar button {
            padding: 10px 28px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            transition: all .2s;
            font-family: inherit;
        }
        .btn-submit { background: var(--ice-dim); color: #fff; }
        .btn-submit:hover { background: var(--ice); }
        .btn-reset  { background: transparent; color: var(--text-dim); border: 1px solid var(--border) !important; }
        .btn-reset:hover { color: #fff; border-color: var(--text-dim) !important; }
        .btn-nav { background: transparent; color: var(--frost); border: 1px solid var(--border) !important; font-weight: 400; }
        .btn-nav:hover { border-color: var(--ice-dim) !important; }

        /* ===== 底部 ===== */
        .app-footer {
            text-align: center;
            padding: 40px 0;
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .app-title { font-size: 18px; }
            .toolbar { gap: 8px; padding: 12px; }
            .toolbar select, .toolbar button { font-size: 12px; padding: 6px 10px; }
            .question-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<header class="app-header">
    <div class="inner">
        <div>
            <span class="app-title">寒风刺骨<span class="frost">— HÁN FĒNG CÌ GǓ —</span></span>
        </div>
        <div style="font-size:12px;color:var(--text-dim);letter-spacing:2px;">马中化 · 答题器</div>
    </div>
</header>

<!-- ===== 主体 ===== -->
<div class="main-wrap" id="app">

    <!-- 工具栏 -->
    <div class="toolbar">
        <span class="label">📋 题型:</span>
        <select id="typeFilter" onchange="renderAll()">
            <option value="all">全部（111题）</option>
            <option value="single">单选题（53题）</option>
            <option value="multi">多选题（28题）</option>
            <option value="judge">判断题（30题）</option>
        </select>
        <button class="primary" onclick="checkAll()">✅ 一键批改全部</button>
        <button class="danger"  onclick="resetAll()">🔄 重置全部</button>
        <div class="score-badge">得分:&nbsp;<span id="scoreDisplay">-</span></div>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

    <!-- 题目列表 -->
    <div id="questionList"></div>

    <!-- 底部操作 -->
    <div class="submit-bar">
        <button class="btn-submit" onclick="checkAll()">✅ 一键批改全部</button>
        <button class="btn-reset"  onclick="resetAll()">🔄 重置全部</button>
        <button class="btn-nav"    onclick="scrollToTop()">⬆ 回到顶部</button>
        <span style="margin-left:auto;font-size:13px;color:var(--text-dim);">
            已答: <strong id="answeredCount" style="color:var(--frost);">0</strong> / <span id="totalCount">111</span>
        </span>
    </div>
</div>

<div class="app-footer">❄ 寒风刺骨 · 马中化答题器 &copy; 2026 ❄</div>

}

function renderAll(){
    var list = getFiltered();
    var html = '';
    list.forEach(function(q){ html += renderOne(q); });
    document.getElementById('questionList').innerHTML = html;
    document.getElementById('totalCount').textContent = list.length;
    updateStats();
}

        cls += ' show-explain';
        var al = q.ans.map(function(i){ return String.fromCharCode(65+i); }).join('、');
        exp = '<div class="explain">📌 正确答案：'+al+'. '+q.ans.map(function(i){ return q.opts[i]; }).join('；')+'</div>';
    } else if(ua.length>0){
        cls += ' answered';
    }
    var tg = q.type==='single'?'<span class="q-type-tag single">单选</span>'
           : q.type==='multi'?'<span class="q-type-tag multi">多选</span>'
           :'<span class="q-type-tag judge">判断</span>';
    var nc = q.type==='single'?'single':q.type==='multi'?'multi':'judge';
    var oh = '';
    if(q.type==='judge') oh = renderJudgeOptions(q,ua);
    else if(q.type==='multi') oh = renderMultiOptions(q,ua);
    else oh = renderSingleOptions(q,ua);
    return '<div class="'+cls+'" id="q-'+q.id+'" style="position:relative;">'
        +'<div class="question-header"><div class="q-num '+nc+'">'+q.id+'</div>'+tg
        +'<div class="q-text">'+q.q+'</div></div>'
        +'<div class="options">'+oh+'</div>'+exp+'</div>';
}

function renderSingleOptions(q,ua){
    var L = ['A','B','C','D'];
    return q.opts.map(function(o,i){
        var c = 'option';
        if(ua.indexOf(i)>=0) c += ' selected';
        if(submittedQuestions[q.id]){
            if(q.ans.indexOf(i)>=0 && ua.indexOf(i)>=0) c += ' correct-answer';
            else if(q.ans.indexOf(i)>=0 && ua.indexOf(i)<0) c += ' missed-correct';
            else if(q.ans.indexOf(i)<0 && ua.indexOf(i)>=0) c += ' wrong-answer';
        }
        return '<label class="'+c+'" onclick="selectOption('+q.id+','+i+',\'single\')">'
            +'<input type="radio" name="q'+q.id+'"><span class="dot"></span>'+L[i]+'. '+o+'</label>';
    }).join('');
}

function renderMultiOptions(q,ua){
    var L = ['A','B','C','D','E','F'];
    var h = q.opts.map(function(o,i){
        var c = 'option multi-opt';
        if(ua.indexOf(i)>=0) c += ' selected';
        if(submittedQuestions[q.id]){
            if(q.ans.indexOf(i)>=0 && ua.indexOf(i)>=0) c += ' correct-answer';
            else if(q.ans.indexOf(i)>=0 && ua.indexOf(i)<0) c += ' missed-correct';
            else if(q.ans.indexOf(i)<0 && ua.indexOf(i)>=0) c += ' wrong-answer';
        }
        return '<div class="'+c+'" onclick="selectOption('+q.id+','+i+',\'multi\')">'
            +'<span class="dot"></span>'+L[i]+'. '+o+'</div>';
    }).join('');
    if(!submittedQuestions[q.id]){
        var hasSel = (ua.length > 0);
        h += '<div class="confirm-multi-wrap">'
            +'<button class="confirm-multi-btn" onclick="confirmMulti('+q.id+')"'
            +(hasSel ? '' : ' disabled')
            +'>✅ 提交本题</button>'
            +(hasSel ? '' : '<span class="confirm-multi-hint">请先选择选项，再点提交</span>')
            +'</div>';
    }
    return h;
}

function renderJudgeOptions(q,ua){
    var L = ['A','B'];
    return q.opts.map(function(o,i){
        var c = 'option';
        if(ua.indexOf(i)>=0) c += ' selected';
        if(submittedQuestions[q.id]){
            if(q.ans.indexOf(i)>=0 && ua.indexOf(i)>=0) c += ' correct-answer';
            else if(q.ans.indexOf(i)>=0 && ua.indexOf(i)<0) c += ' missed-correct';
            else if(q.ans.indexOf(i)<0 && ua.indexOf(i)>=0) c += ' wrong-answer';
        }
        return '<label class="'+c+'" onclick="selectOption('+q.id+','+i+',\'judge\')">'
            +'<input type="radio" name="q'+q.id+'"><span class="dot"></span>'+o+'</label>';
    }).join('');
}

function selectOption(qid,idx,type){
    if(submittedQuestions[qid]) return;
    if(type==='multi'){
        var arr = userAnswers[qid] || [];
        var pos = arr.indexOf(idx);
        if(pos>=0) arr.splice(pos,1);
        else arr.push(idx);
        userAnswers[qid] = arr;
    } else {
        userAnswers[qid] = [idx];
        submittedQuestions[qid] = true;
    }
    renderAll();
}

function confirmMulti(qid){
    if(!userAnswers[qid] || userAnswers[qid].length===0) return;
    submittedQuestions[qid] = true;
    renderAll();
    updateStats();
}

function isCorrect(q,ua){
    if(ua.length !== q.ans.length) return false;
    var a = ua.slice().sort();
    var b = q.ans.slice().sort();
    for(var i=0; i<a.length; i++){ if(a[i]!==b[i]) return false; }
    return true;
}

function checkAll(){
    var list = getFiltered();
    list.forEach(function(q){ submittedQuestions[q.id] = true; });
    renderAll();
    updateStats();
    var fw = document.querySelector('.question-card.incorrect');
    if(fw) fw.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetAll(){
    var hasData = Object.keys(submittedQuestions).length>0 || Object.keys(userAnswers).length>0;
    if(hasData && !confirm('确定要重置全部作答记录吗？此操作不可撤销。')) return;
    userAnswers = {};
    submittedQuestions = {};
    renderAll();
}

function scrollToTop(){
    window.scrollTo({top:0,behavior:'smooth'});
}

function updateStats(){
    var list = getFiltered();
    var total = list.length;
    var answered = 0, correct = 0;
    list.forEach(function(q){
        var ua = userAnswers[q.id] || [];
        if(ua.length>0) answered++;
        if(submittedQuestions[q.id] && isCorrect(q,ua)) correct++;
    });
    document.getElementById('answeredCount').textContent = answered;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('progressFill').style.width = total>0 ? (answered/total*100)+'%' : '0%';
    var has = Object.keys(submittedQuestions).length>0;
    document.getElementById('scoreDisplay').textContent = has ? correct+'/'+total : '-';
}

renderAll();
</script>
</body>
</html>
